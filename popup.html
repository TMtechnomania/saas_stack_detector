<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SaaS Stack Detector</title>
		<link rel="stylesheet" href="popup.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet" />
	</head>
	<body>
		<div class="app">
			<!-- Header -->
			<header class="header">
				<div class="header-left">
					<div class="logo-icon">
						<svg
							width="22"
							height="22"
							viewBox="0 0 24 24"
							fill="none">
							<path
								d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round" />
						</svg>
					</div>
					<div>
						<h1 class="title">Stack Detector</h1>
						<p class="subtitle" id="site-url">Scanning…</p>
					</div>
				</div>
				<div class="header-actions">
					<button id="btn-refresh" class="icon-btn" title="Re-scan">
						<svg
							width="16"
							height="16"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<polyline points="23 4 23 10 17 10"></polyline>
							<polyline points="1 20 1 14 7 14"></polyline>
							<path
								d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
						</svg>
					</button>
					<button
						id="btn-export"
						class="icon-btn"
						title="Export JSON">
						<svg
							width="16"
							height="16"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<path
								d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
							<polyline points="7 10 12 15 17 10"></polyline>
							<line x1="12" y1="15" x2="12" y2="3"></line>
						</svg>
					</button>
					<button
						id="btn-copy"
						class="icon-btn"
						title="Copy to clipboard">
						<svg
							width="16"
							height="16"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<rect
								x="9"
								y="9"
								width="13"
								height="13"
								rx="2"
								ry="2"></rect>
							<path
								d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
						</svg>
					</button>
				</div>
			</header>

			<!-- Scan Status -->
			<div id="scan-status" class="scan-status">
				<div class="scan-bar">
					<div class="scan-bar-fill"></div>
				</div>
				<span class="scan-text">Detecting stack…</span>
			</div>

			<!-- Results Container -->
			<div id="results" class="results"></div>

			<!-- Empty State -->
			<div id="empty-state" class="empty-state hidden">
				<div class="empty-icon">
					<svg
						width="48"
						height="48"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="1.5"
						stroke-linecap="round"
						stroke-linejoin="round"
						opacity="0.4">
						<circle cx="11" cy="11" r="8"></circle>
						<line x1="21" y1="21" x2="16.65" y2="16.65"></line>
						<line x1="8" y1="11" x2="14" y2="11"></line>
					</svg>
				</div>
				<p class="empty-title">No technologies detected</p>
				<p class="empty-sub">
					This site may use server-rendered or custom-built tech.
				</p>
			</div>

			<!-- Footer -->
			<footer class="footer">
				<span class="footer-count" id="tech-count"
					>0 technologies found</span
				>
				<button
					id="btn-missing"
					class="missing-btn"
					title="Report a missing technology">
					Something missing?
				</button>
			</footer>

			<!-- Toast -->
			<div id="toast" class="toast hidden">Copied!</div>
		</div>

		<script src="popup.js"></script>
	</body>
</html>
