<!doctype html>
<html>
	<head>
		<title>Icon Generator</title>
	</head>
	<body>
		<p>
			Right-click each canvas and "Save image as" to create the PNG icons.
		</p>
		<div>
			<h3>16x16</h3>
			<canvas id="c16" width="16" height="16"></canvas>
			<h3>48x48</h3>
			<canvas id="c48" width="48" height="48"></canvas>
			<h3>128x128</h3>
			<canvas id="c128" width="128" height="128"></canvas>
		</div>
		<script>
			function drawIcon(canvas) {
				const s = canvas.width;
				const ctx = canvas.getContext("2d");

				// Background
				const r = s * 0.22;
				ctx.beginPath();
				ctx.roundRect(0, 0, s, s, r);
				ctx.fillStyle = "#0b0f1a";
				ctx.fill();

				const cx = s / 2;
				const cy = s / 2;
				const scale = s / 128;

				const grad = ctx.createLinearGradient(0, 0, s, s);
				grad.addColorStop(0, "#0072ff");
				grad.addColorStop(1, "#00c6ff");

				function drawDiamond(offsetY, opacity) {
					ctx.save();
					ctx.globalAlpha = opacity;
					ctx.fillStyle = grad;
					ctx.beginPath();
					ctx.moveTo(cx, cy + (offsetY - 19) * scale);
					ctx.lineTo(cx + 38 * scale, cy + offsetY * scale);
					ctx.lineTo(cx, cy + (offsetY + 19) * scale);
					ctx.lineTo(cx - 38 * scale, cy + offsetY * scale);
					ctx.closePath();
					ctx.fill();
					ctx.restore();
				}

				drawDiamond(-19, 0.95);
				drawDiamond(-6, 0.65);
				drawDiamond(7, 0.4);
			}

			drawIcon(document.getElementById("c16"));
			drawIcon(document.getElementById("c48"));
			drawIcon(document.getElementById("c128"));
		</script>
	</body>
</html>
